spring:
  datasource:
    url: jdbc:h2:mem:ims-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  auth:
    jwt-secret-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  bootstrap:
    admin-email:
    admin-password:
  cors:
    allowed-origins:
      - http://localhost:5173
