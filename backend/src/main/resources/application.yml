server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

spring:
  application:
    name: ims-api
  datasource:
    url: ${IMS_DB_URL:jdbc:mysql://127.0.0.1:3306/inventory_management_system?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${IMS_DB_USERNAME:ims_app}
    password: ${IMS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  auth:
    issuer: ims-api
    jwt-secret-base64: ${IMS_JWT_SECRET_BASE64:}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    cookie-secure: ${IMS_COOKIE_SECURE:true}
  bootstrap:
    admin-email: ${IMS_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${IMS_BOOTSTRAP_ADMIN_PASSWORD:}
  checkout:
    tax-rate: ${IMS_CHECKOUT_TAX_RATE:0.00}
    shipping-amount: ${IMS_CHECKOUT_SHIPPING_AMOUNT:0.00}
    currency-code: ${IMS_CHECKOUT_CURRENCY_CODE:PHP}
  cors:
    allowed-origins: ${IMS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
